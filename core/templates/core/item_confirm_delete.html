{% extends "core/base.html" %}

{% block title %}Supprimer | StudioBoard{% endblock %}

{% block content %}
  <div class="card">
    <h2>Supprimer cet element ?</h2>
    <p>Cette action est definitive pour "{{ object.title }}".</p>
    <form method="post" class="actions">
      {% csrf_token %}
      <button class="button" type="submit">Supprimer</button>
      <a class="button secondary" href="{% url 'item_detail' object.pk %}">Annuler</a>
    </form>
  </div>
{% endblock %}
